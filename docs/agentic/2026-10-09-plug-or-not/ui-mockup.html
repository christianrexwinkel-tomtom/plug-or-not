<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plug or Not Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Plug or Not v0.1 — clickable UI mockup. Layout and visual design only; all data is fake and hard-coded.
   Phone-first at ~390 px; on a laptop the app sits in a phone frame with a notes panel beside it. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#0f1f1c; --muted:#4f625e; --line:#cfdad7; --field:#f7faf9;
  --charge:#086b57; --charge-ink:#ffffff; --charge-soft:#dcf0ea;
  --warn:#8a4b00; --warn-soft:#fff1d9; --warn-line:#c27a12;
  --bad:#a51d12; --bad-ink:#ffffff; --bad-soft:#fbe3df;
  --unknown:#4f5b59; --unknown-soft:#eef1f0;
  --focus:#1d5fd1;
  --map-land:#e8ebe4; --map-road:#ffffff; --map-edge:#cdd4cd; --map-park:#cde5c4; --map-water:#b6d6ea; --map-label:#66746f;
  --mock:#2b2440; --mock-ink:#f3efff; --mock-accent:#c9b8ff;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --surface:#141f1d; --ink:#e6efed; --muted:#9db0ab; --line:#2b3b38; --field:#0f1917;
  --charge:#3cc9a2; --charge-ink:#04201a; --charge-soft:#123a31;
  --warn:#ffc061; --warn-soft:#3a2a10; --warn-line:#d8962e;
  --bad:#ff8b7b; --bad-ink:#2b0703; --bad-soft:#3d1a16;
  --unknown:#b3c0bd; --unknown-soft:#1c2826;
  --focus:#7aa7ff; --map-land:#18221f; --map-road:#2c3a36; --map-edge:#121a18; --map-park:#1d3324; --map-water:#173246; --map-label:#8fa29d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1312; --surface:#141f1d; --ink:#e6efed; --muted:#9db0ab; --line:#2b3b38; --field:#0f1917;
  --charge:#3cc9a2; --charge-ink:#04201a; --charge-soft:#123a31;
  --warn:#ffc061; --warn-soft:#3a2a10; --warn-line:#d8962e;
  --bad:#ff8b7b; --bad-ink:#2b0703; --bad-soft:#3d1a16;
  --unknown:#b3c0bd; --unknown-soft:#1c2826;
  --focus:#7aa7ff; --map-land:#18221f; --map-road:#2c3a36; --map-edge:#121a18; --map-park:#1d3324; --map-water:#173246; --map-label:#8fa29d; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--f-body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Mockup state switcher (not part of the product) ---------- */
.mockbar{position:sticky;top:0;z-index:20;background:var(--mock);color:var(--mock-ink);
  border-bottom:3px dashed var(--mock-accent);padding:8px 16px;font:500 13px/1.3 var(--f-data)}
.mockbar .row{display:flex;gap:8px;align-items:center;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.mockbar .tag{background:var(--mock-accent);color:var(--mock);padding:3px 7px;border-radius:4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.mockbar select{flex:1 1 200px;min-width:0;background:#3a3156;color:var(--mock-ink);border:1px solid #5b5080;border-radius:6px;padding:7px 8px;font:inherit}
.mockbar button{background:#3a3156;color:var(--mock-ink);border:1px solid #5b5080;border-radius:6px;padding:6px 10px;font:inherit}
.mockbar details{max-width:1080px;margin:6px auto 0;font:400 13px/1.4 var(--f-body);color:#d9d2f2}
.mockbar summary{cursor:pointer;font-family:var(--f-data)}

/* ---------- Stage: full-bleed on a phone, phone frame + notes on a laptop ---------- */
.stage{display:flex;justify-content:center;gap:40px;padding:0}
.phone{width:100%;max-width:430px;min-height:calc(100vh - 52px);background:var(--bg);position:relative}
.notes{display:none}
@media (min-width:760px){
  .stage{padding:32px 24px 64px;align-items:flex-start}
  .phone{width:390px;min-height:780px;border-radius:36px;border:10px solid #111a18;overflow:clip;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
  .notes{display:block;width:300px;position:sticky;top:84px;font-size:15px;color:var(--muted)}
  .notes h2{font:700 13px/1 var(--f-data);text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin:0 0 10px}
  .notes .nbox{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:16px}
  .notes p{margin:0 0 10px}
  .mockbar details{display:none}
}

/* ---------- App chrome ---------- */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.brand{font:800 20px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .plug{width:26px;height:26px;border-radius:8px;background:var(--charge);color:var(--charge-ink);display:grid;place-items:center}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px}
.screen{padding:4px 16px 32px}
h1{font:800 28px/1.1 var(--f-display);letter-spacing:-.015em;margin:8px 0 4px}
.lede{color:var(--muted);margin:0 0 18px}
h2.sec{font:700 13px/1 var(--f-data);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 10px}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field .hint{display:block;color:var(--muted);font-size:14px;margin:-2px 0 6px}
.inwrap{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;background:var(--field);overflow:hidden}
.inwrap:focus-within{border-color:var(--focus)}
.inwrap input{flex:1;min-width:0;border:0;background:transparent;padding:12px 14px;font:500 19px/1.2 var(--f-data);outline:none}
.inwrap .unit{display:flex;align-items:center;padding:0 14px;color:var(--muted);font-weight:600;border-left:2px solid var(--line);white-space:nowrap}
.field.err .inwrap{border-color:var(--bad);background:var(--bad-soft)}
.errmsg{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-weight:700;margin-top:6px;font-size:15px}
.errmsg svg{flex:none;margin-top:2px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:15px 18px;font-weight:700;font-size:18px;border:2px solid transparent}
.btn-primary{background:var(--charge);color:var(--charge-ink)}
.btn-secondary{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-small{width:auto;padding:9px 16px;font-size:16px;border-radius:10px}

.notice{display:flex;gap:10px;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-weight:600;border:2px solid}
.notice svg{flex:none;margin-top:2px}
.notice.info{background:var(--warn-soft);border-color:var(--warn-line);color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.notice p{margin:0}
.notice .acts{margin-top:10px}

/* event picker + stepper */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;line-height:1.2}
.chip b{display:block;font-weight:700}
.chip span{color:var(--muted);font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--charge);background:var(--charge-soft);box-shadow:inset 0 0 0 1px var(--charge)}
.chip[aria-pressed="true"] span{color:var(--ink)}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stepper button{width:56px;align-self:stretch;border:0;background:var(--field);font:700 26px/1 var(--f-body)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper .val{flex:1;text-align:center;padding:10px 4px}
.stepper .val b{display:block;font:800 24px/1.1 var(--f-display)}
.stepper .val span{color:var(--muted);font-size:14px;font-weight:600}
.limitnote{color:var(--warn);font-weight:700;font-size:15px;margin-top:6px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;border-top:2px solid var(--line)}
.coords .inwrap input{font-size:17px}
.coords .gobtn{border:0;border-left:2px solid var(--line);background:var(--ink);color:var(--surface);font-weight:700;padding:0 18px}
.coords.highlight .inwrap{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}

/* ---------- Loading ---------- */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;min-height:60vh}
.loading p{font:700 22px/1.25 var(--f-display);margin:0}
.pulse{width:64px;height:64px;border-radius:50%;background:var(--charge-soft);display:grid;place-items:center;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--charge);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}}

/* ---------- Results ---------- */
.ctx{position:sticky;top:var(--mockh,0px);z-index:5;background:var(--bg);padding:8px 16px 10px;border-bottom:2px solid var(--line)}
.ctxrow{display:flex;gap:8px;align-items:stretch}
.batt{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 12px;text-align:left}
.batt small{color:var(--muted);font-size:12px;font-weight:600}
.batt b{font:800 20px/1.1 var(--f-display)}
.ctx .stepper{flex:1;border-radius:12px}
.ctx .stepper button{width:44px;font-size:22px}
.ctx .stepper .val{padding:4px}
.ctx .stepper .val b{font-size:20px}
.ctx .stepper .val span{font-size:13px}
.spot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.spot b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--focus);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.mocknote{margin:8px 0 0;font:500 12px/1.3 var(--f-data);color:var(--mock);background:var(--mock-accent);border-radius:6px;padding:5px 8px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 4px}
.listhead h1{font-size:22px;margin:0}
.meta{color:var(--muted);font-size:14px;margin:0 0 12px}
.meta b{color:var(--ink)}

.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.entry{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px 14px;position:relative}
.entry.v-worth{border-color:var(--charge)}
.entry.v-never{border-color:var(--bad)}
.entry.v-unknown{border-style:dashed}
.etop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.verdict{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:7px 12px 7px 9px;font:800 20px/1.05 var(--f-display);letter-spacing:-.005em}
.verdict svg{flex:none}
.v-worth .verdict{background:var(--charge);color:var(--charge-ink)}
.v-notstay .verdict{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn-line)}
.v-never .verdict{background:var(--bad);color:var(--bad-ink)}
.v-unknown .verdict{background:var(--unknown-soft);color:var(--unknown);box-shadow:inset 0 0 0 2px var(--unknown);outline:2px dashed transparent}
.amount{text-align:right;font-weight:700;line-height:1.1}
.amount b{display:block;font:800 22px/1.1 var(--f-display)}
.amount small{font-size:13px;color:var(--muted);font-weight:600}
.v-worth .amount b{color:var(--charge)}
.v-notstay .amount b,.v-never .amount b{color:var(--bad)}
.rank{position:absolute;top:-11px;left:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 12px/24px var(--f-data);text-align:center}
.op{font:700 18px/1.2 var(--f-body);margin:0}
.addr{margin:1px 0 0;color:var(--muted)}
.addr .num{color:var(--ink)}
.price{margin:8px 0 0;font:500 15px/1.35 var(--f-data);background:var(--field);border-radius:8px;padding:6px 9px;display:inline-block}
.stats{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.stats dt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stats dd{margin:0;font:500 16px/1.2 var(--f-data);grid-row:2}
.stats dd small{color:var(--muted);font-size:13px}
.window{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-weight:700}
.window svg{flex:none;margin-top:2px}
.reason{margin:10px 0 0;font-weight:600}
.message{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;margin-top:18px}
.message svg{margin-bottom:8px}
.message p{font:700 20px/1.3 var(--f-display);margin:0 0 14px}
.message p:last-child{margin-bottom:0}
.message .btn{max-width:240px;margin:0 auto}
/* ---------- Results map + bottom sheet ---------- */
.rwrap{display:flex;flex-direction:column;height:calc(100dvh - var(--mockh,0px))}
@media (min-width:760px){.rwrap{height:760px}}
.rwrap .ctx{position:relative;top:auto}
.mapwrap{position:relative;flex:1;overflow:hidden;background:var(--map-land)}
svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus-visible .pinbody{stroke:var(--focus);stroke-width:4}
.legend{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.legend span{background:var(--surface);border-radius:999px;padding:3px 9px 3px 4px;font-size:13px;font-weight:700;display:inline-flex;gap:5px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.overlay{position:absolute;top:44px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.overlay .notice{margin:0;padding:8px 10px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.overlay .mocknote{margin:0}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;max-height:84%}
.sheet.s-list{height:84%}
.sheet.s-detail{max-height:62%}
.grab{border:0;background:none;padding:8px 0 4px;width:100%}
.grab span{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 8px}
.sheethead h2{font:800 20px/1.15 var(--f-display);margin:0}
.sheetbody{overflow:auto;padding:12px 16px 18px}
.sheet .meta{margin:0 16px 10px}
.best{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:0 16px 12px;line-height:1.2;text-align:left;border:2px solid var(--charge);background:var(--charge-soft);border-radius:12px;padding:9px 12px}
.best b{display:block}
.best small{color:var(--muted);font-weight:600}
.best .go{margin-left:auto;font-weight:700;color:var(--charge);white-space:nowrap}
.closebtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;font:700 20px/1 var(--f-body);flex:none}
.entries.click .entry{cursor:pointer}
.entries.click .entry:hover{box-shadow:0 0 0 3px var(--line)}
.foot{color:var(--muted);font-size:13px;margin:18px 0 0;text-align:center}
</style>
</head>
<body>

<div class="mockbar" role="region" aria-label="Mockup state switcher (not part of the product)">
  <div class="row">
    <span class="tag">Mockup</span>
    <button type="button" id="mPrev" aria-label="Previous state">‹</button>
    <select id="mSelect" aria-label="Jump to screen or state"></select>
    <button type="button" id="mNext" aria-label="Next state">›</button>
  </div>
  <details><summary>About this state</summary><div id="mNoteSmall"></div></details>
</div>

<div class="stage">
  <main class="phone" id="app" aria-live="polite"></main>
  <aside class="notes" aria-label="Mockup notes">
    <h2>Mockup notes</h2>
    <div class="nbox" id="mNote"></div>
    <p style="margin-top:14px;font-size:13px">Fake, hard-coded data. No real location, data loading or cost engine. Results figures are fixed for battery 10% and a 3-hour stay at the PRD settings.</p>
  </aside>
</div>

<script>
/* ---------- Icons ---------- */
const I = {
  check:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".22"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>',
  cross:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".22"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
  q:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="3 2.4"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>',
  win:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  warn:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="18" r="1.3" fill="currentColor"/></svg>',
  info:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/></svg>',
  pin:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.6 7-12.2A7 7 0 0 0 5 9.8C5 15.4 12 22 12 22z" fill="none" stroke="currentColor" stroke-width="2.3"/><circle cx="12" cy="10" r="2.6" fill="currentColor"/></svg>',
  gear:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',

/* ---------- App state ---------- */
let S, timer = null;
function defaults(){
  return {screen:'setup', prev:'parked',
    vals:Object.fromEntries(FIELDS.map(f=>[f.k,f.v])), errs:{}, storage:false, reopen:false,
    battery:'', ev:'shopping', stay:90, limit:false, battErr:false,
    coords:'', coordErr:false, banner:null, hl:false,
    spot:'Your location', spotCoords:'51.4436, 5.5519', approx:false, msg:null, sheet:'peek', loc:null};
}
function applyState(id){
  clearTimeout(timer);
  const st = STATES.find(x=>x.id===id) || STATES[0];
  S = Object.assign(defaults(), JSON.parse(JSON.stringify(st.s)));
  if (st.s.vals) S.vals = Object.assign(defaults().vals, st.s.vals);
  if (id==='setup') S.storage = false;
  if (S.coords && S.banner==='outside'){ S.spot='Typed spot'; }
  sel.value = id; showNote(id); render();
}
function go(screen, extra){ clearTimeout(timer); Object.assign(S, {screen}, extra||{}); syncSwitcher(); render(); window.scrollTo(0,0); }
function syncSwitcher(){
  if (S.screen==='results') window.scrollTo(0,0);
  let id = null;
  if (S.screen==='setup') id = S.reopen?'setup-reopen':(S.storage?'setup-storage':'setup');
  else if (S.screen==='loading') id='loading';
  else if (S.screen==='results') id = S.msg==='full'?'msg-full':S.msg==='load'?'msg-load':S.approx?'results-approx':S.sheet==='list'?'results-list':S.sheet==='detail'?(S.loc==='berg'?'results-pin-two':S.loc==='parkstraat'?'results-pin':null):'results';
  else if (S.screen==='parked') id = S.banner==='denied'?'msg-denied':S.banner==='outside'?'msg-outside':S.coordErr?'msg-coords':S.battErr?'parked-battery':'parked';
  if (id){ sel.value=id; showNote(id); }
}

/* ---------- Helpers ---------- */
const evOf = k => EVENTS.find(e=>e.k===k);
function dur(min){ if (min<60) return min+' min'; const h=Math.floor(min/60), m=min%60; return m? h+'h'+String(m).padStart(2,'0') : h+'h'; }
function stayLabel(){ const e=evOf(S.ev); return e.label + (S.stay!==e.min?' (adjusted)':''); }
function metres(m){ return m.toLocaleString('en-GB')+' m'; }
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function appbar(gear){
  return `<header class="appbar"><div class="brand"><span class="plug">${I.bolt}</span>Plug or Not</div>${gear?`<button class="iconbtn" data-a="settings">${I.gear}Settings</button>`:''}</header>`;
}
function stepper(compact){
  const lo=S.stay<=15, hi=S.stay>=1440;
  return `<div class="stepper" role="group" aria-label="Length of stay">
    <button data-a="stay-" aria-label="15 minutes shorter" ${lo?'aria-disabled="true"':''}>−</button>
    <div class="val"><b class="num" style="font-family:var(--f-display)">${dur(S.stay)}</b><span>${esc(stayLabel())}</span></div>
    <button data-a="stay+" aria-label="15 minutes longer" ${hi?'aria-disabled="true"':''}>+</button></div>

}

function entry(e,i,clickable){

  if (e.v==='unknown') return `<li class="entry v-unknown"${click}><span class="rank">${i+1}</span>${top}${place}<p class="reason">${e.reason}</p></li>`;

}
function pin(lid){
  const list=ENTRIES.filter(e=>e.loc===lid), best=list[0], x=PINS[lid][0], y=Y(PINS[lid][1]), sel=S.sheet==='detail'&&S.loc===lid;
  const rank=ENTRIES.indexOf(best)+1, vd=VERDICT[best.v];
  const label=`${rank}. ${best.op}, ${best.addr}: ${vd.t}${best.amt?', '+best.amt:''}${list.length>1?', and '+(list.length-1)+' more price':''}`;
  return `<g class="pin" data-a="pin" data-loc="${lid}" role="button" tabindex="0" aria-label="${esc(label)}" transform="translate(${x} ${y}) scale(${sel?1.3:1})">
    ${sel?'<ellipse cx="0" cy="0" rx="10" ry="4" fill="rgba(0,0,0,.25)"/>':''}
    <path class="pinbody" d="M0 0 C-4 -9 -16 -15 -16 -28 A16 16 0 1 1 16 -28 C16 -15 4 -9 0 0Z" fill="${PIN_COL[best.v]}" stroke="${sel?'var(--ink)':'#fff'}" stroke-width="${sel?3:2.2}" ${best.v==='unknown'?'stroke-dasharray="4 3"':''}/>
    ${glyph(best.v)}
    <circle cx="13" cy="-43" r="8.5" fill="var(--ink)" stroke="#fff" stroke-width="1.5"/>
    <text x="13" y="-39.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="10" fill="var(--surface)">${rank}</text>
    ${list.length>1?`<circle cx="-13" cy="-43" r="8.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="-13" y="-39.5" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-weight="800" font-size="10" fill="var(--ink)">×${list.length}</text>`:''}
  </g>`;
}
function mapSvg(){
  const road=(d,w)=>`<path d="${d}" fill="none" stroke="var(--map-edge)" stroke-width="${w+3}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--map-road)" stroke-width="${w}" stroke-linecap="round"/>`;
  const lbl=(x,y,r,t)=>`<text x="${x}" y="${y}" transform="rotate(${r} ${x} ${y})" font-family="Source Sans 3, sans-serif" font-size="10.5" font-weight="600" fill="var(--map-label)" letter-spacing=".04em">${t}</text>`;
  // MOCKUP ONLY: a hand-drawn stand-in for a real map.
  return `<svg class="map" viewBox="0 0 390 540" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of the 10 nearest chargers around your spot">
    <rect data-a="mapbg" width="390" height="540" fill="var(--map-land)"/>
    <g data-a="mapbg" transform="matrix(1 0 0 0.86 0 -14.6)">
      <path d="M40 360 C70 330 150 335 170 370 C190 410 150 450 100 445 C55 440 25 400 40 360Z" fill="var(--map-park)"/>
      <path d="M300 520 C320 505 360 510 372 530 C380 550 350 570 320 562 C300 556 290 535 300 520Z" fill="var(--map-water)"/>
      <path d="M-10 560 C80 540 140 600 230 640" fill="none" stroke="var(--map-water)" stroke-width="10"/>
      ${road('M-10 300 C110 292 260 276 400 266',9)}
      ${road('M196 -10 C202 150 188 400 206 640',9)}
      ${road('M30 112 L196 238',6)}
      ${road('M202 300 C262 318 330 330 400 352',7)}
      ${road('M110 70 L400 128',7)}
      ${road('M226 640 C262 540 330 480 400 446',7)}
      ${road('M-10 200 C60 190 120 160 150 120',5)}
      ${road('M120 300 C110 360 90 420 60 640',5)}
      ${road('M270 120 C275 180 280 240 300 330',5)}
      ${lbl(18,290,-1.5,'PARKSTRAAT')}${lbl(206,560,86,'BERG')}${lbl(78,146,37,'KERKSTRAAT')}${lbl(320,330,15,'GERWENSEWEG')}${lbl(290,105,11,'EUROPALAAN')}${lbl(276,500,-30,'BOORDSEWEG')}
      ${lbl(66,400,0,'PARK')}
    </g>
    <circle cx="195" cy="${Y(280)}" r="20" fill="var(--focus)" opacity=".18"/>
    <circle cx="195" cy="${Y(280)}" r="8" fill="var(--focus)" stroke="#fff" stroke-width="3"/>
    ${Object.keys(PINS).map(pin).join('')}
  </svg>`;
}
const LEG = (v,t)=>`<span><svg width="22" height="22" viewBox="-17 -46 34 48" aria-hidden="true"><path d="M0 0 C-4 -9 -16 -15 -16 -28 A16 16 0 1 1 16 -28 C16 -15 4 -9 0 0Z" fill="${PIN_COL[v]}" stroke="#fff" stroke-width="2" ${v==='unknown'?'stroke-dasharray="4 3"':''}/>${glyph(v)}</svg>${t}</span>`;
function sheet(){
  if (S.sheet==='detail'){
    const list=ENTRIES.filter(e=>e.loc===S.loc);
    return `<section class="sheet s-detail" aria-label="Charger details">
      <button class="grab" data-a="tolist" aria-label="Show all chargers"><span></span></button>
      <div class="sheethead"><button class="linkbtn" data-a="tolist">‹ All chargers</button><button class="closebtn" data-a="close" aria-label="Close details">×</button></div>
      ${list.length>1?`<p class="meta"><b>${list.length} prices at this location.</b> Different charging points here use different tariffs.</p>`:''}
      <div class="sheetbody" style="padding-top:12px"><ol class="entries">${list.map(e=>entry(e)).join('')}</ol></div></section>`;
  }
  if (S.sheet==='list'){
    return `<section class="sheet s-list" aria-label="Ranked list">
      <button class="grab" data-a="close" aria-label="Back to the map"><span></span></button>
      <div class="sheethead"><h2>Best saving first</h2><button class="closebtn" data-a="close" aria-label="Back to the map">×</button></div>
      <p class="meta">10 nearest chargers · prices include VAT and your card fees · <b>Tariff data from ${DATA_TIME}</b></p>
      <div class="sheetbody"><ol class="entries click">${ENTRIES.map(e=>entry(e,0,true)).join('')}</ol>
      <p class="foot">Distances are straight-line. Prices from NDW open data, ${DATA_TIME}.</p></div></section>`;
  }
  const b=ENTRIES[0];
  return `<section class="sheet s-peek" aria-label="Summary">
    <button class="grab" data-a="tolist" aria-label="Show the ranked list"><span></span></button>
    <div class="sheethead"><h2>10 nearest chargers</h2><button class="linkbtn" data-a="tolist">List ▲</button></div>
    <p class="meta" style="font-size:13px;margin-bottom:8px">Incl. VAT and card fees · <b>Tariff data from ${DATA_TIME}</b></p>
    <button class="best" data-a="pin" data-loc="${b.loc}"><span style="color:var(--charge)">${I.check}</span><span><b>Best: ${b.op}, ${b.addr.split(',')[0]}</b><small>${b.amt} · ${metres(b.m)}</small></span><span class="go">Details</span></button>
  </section>`;
}
function vResults(){
  let body;
  if (S.msg==='load') body = `<section class="screen"><div class="message" role="alert"><span style="color:var(--bad)">${I.wifi}</span><p>Couldn't load charger prices. Check your connection and try again.</p><button class="btn btn-primary" data-a="retry">Try again</button></div></section>`;
  else if (S.msg==='full') body = `<section class="screen"><div class="message" role="status"><span style="color:var(--charge)">${I.full}</span><p>Your battery is full, so there's nothing to charge here.</p></div></section>`;
  else body = `<div class="mapwrap">
    ${mapSvg()}
    <div class="legend">${LEG('worth','Worth it')}${LEG('notstay','Not worth it')}${LEG('unknown','Price unknown')}</div>
    <div class="overlay">
      ${S.approx?`<div class="notice info" role="status">${I.info}<div><p>Your location is approximate</p><p style="font-weight:400"><button class="linkbtn" data-a="precise">Enter coordinates</button> for a precise spot.</p></div></div>`:''}
      ${S.stay!==180?`<p class="mocknote">MOCKUP: figures stay fixed at 3h. The real page re-ranks instantly here.</p>`:''}
    </div>
    ${sheet()}
  </div>`;
  return `<div class="rwrap">${appbar(true)}${ctxBar()}${body}</div>`;
}

const app = document.getElementById('app');
function render(){
  app.innerHTML = {setup:vSetup, parked:vParked, loading:vLoading, results:vResults}[S.screen]();
}

/* ---------- Interactions ---------- */
function startSearch(extra){
  go('loading');
  timer = setTimeout(()=>go('results', Object.assign({msg:null, approx:false, sheet:'peek', loc:null}, extra)), 1300);
}
function batteryOk(){
  const b=S.battery.trim(); const n=Number(b.replace(',','.'));
  if (b===''||!isFinite(n)||n<0||n>100){ S.battErr=true; return false; }
  S.battErr=false; return true;
}
function parseCoords(t){
  const m=t.trim().match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if(!m) return null; const lat=+m[1], lon=+m[2];
  return (Math.abs(lat)<=90&&Math.abs(lon)<=180)?{lat,lon}:null;
}
// MOCKUP ONLY: a rough box instead of the real border polygon (D-15).
function inNL(p){ return p.lat>50.75&&p.lat<53.6&&p.lon>3.3&&p.lon<7.25&&!(p.lat<51.25&&p.lon<5.6); }

app.addEventListener('click', ev=>{
  const b=ev.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if (b.tagName==='BUTTON' && b.type!=='submit') ev.preventDefault();
  if (a==='settings'){ go('setup',{reopen:true, prev:S.screen, errs:{}}); }
  else if (a==='cancel'){ go(S.prev||'parked',{reopen:false, errs:{}}); }
  else if (a==='ev'){ const e=evOf(b.dataset.k); S.ev=e.k; S.stay=e.min; S.limit=false; render(); }
  else if (a==='stay-'||a==='stay+'){
    const want=S.stay+(a==='stay+'?15:-15);
    S.stay=Math.min(1440,Math.max(15,want)); S.limit = want<15||want>1440; render();
  }
  else if (a==='locate'){
    S.banner=null; S.hl=false; S.coordErr=false;
    if(!batteryOk()){ go('parked'); return; }
    if(Number(S.battery)===100){ S.spot='Your location'; S.spotCoords='51.4436, 5.5519'; startSearch({msg:'full'}); return; }
    S.spot='Your location'; S.spotCoords='51.4436, 5.5519'; startSearch();
  }
  else if (a==='coords'){
    const p=parseCoords(S.coords); S.banner=null; S.hl=false;
    if(!p){ S.coordErr=true; go('parked'); return; }
    S.coordErr=false;
    if(!batteryOk()){ go('parked'); return; }
    if(!inNL(p)){ go('parked',{banner:'outside', hl:true}); return; }
    S.spot='Typed spot'; S.spotCoords=p.lat+', '+p.lon;
    if(Number(S.battery)===100){ startSearch({msg:'full'}); return; }
    startSearch();
  }
  else if (a==='back'){ go('parked',{msg:null, approx:false}); }
  else if (a==='precise'){ go('parked',{msg:null, approx:false, hl:true}); setTimeout(()=>document.getElementById('coords')?.focus(),50); }
  else if (a==='retry'){ startSearch(); }
  else if (a==='pin'){ S.sheet='detail'; S.loc=b.dataset.loc; render(); syncSwitcher(); }
  else if (a==='tolist'){ S.sheet='list'; render(); syncSwitcher(); }
  else if (a==='close' || a==='mapbg'){ S.sheet='peek'; S.loc=null; render(); syncSwitcher(); }
});
app.addEventListener('input', ev=>{
  const t=ev.target;
  if (t.id==='batt'){ S.battery=t.value; }
  else if (t.id==='coords'){ S.coords=t.value; }
  else if (t.name && S.vals && t.name in S.vals){ S.vals[t.name]=t.value; }
});
app.addEventListener('keydown', ev=>{
  if(ev.key==='Enter' && ev.target.id==='coords'){ ev.preventDefault(); app.querySelector('[data-a="coords"]').click(); return; }
  const r=ev.target.closest('[role="button"][data-a]');   // SVG pins and list cards
  if(r && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); r.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});
app.addEventListener('submit', ev=>{
  ev.preventDefault();
  const errs={};
  for (const f of FIELDS){
    const raw=String(S.vals[f.k]).trim();
    if(raw===''){ errs[f.k]='empty'; continue; }
    const n=Number(raw.replace(',','.'));   // comma decimals (G1-AC2)
    if(!isFinite(n)||n<f.min||n>f.max) errs[f.k]='range';
  }
  S.errs=errs;
  if (Object.keys(errs).length){ render(); app.querySelector('[aria-invalid="true"]')?.focus(); return; }
  go(S.reopen ? (S.prev==='setup'?'parked':S.prev) : 'parked', {reopen:false, storage:false});
});

/* ---------- Switcher wiring ---------- */
const sel=document.getElementById('mSelect');
let lastG=null, og=null;
for (const st of STATES){
  if (st.g!==lastG){ og=document.createElement('optgroup'); og.label=st.g; sel.appendChild(og); lastG=st.g; }
  const o=document.createElement('option'); o.value=st.id; o.textContent=st.label; og.appendChild(o);
}
function showNote(id){
  const st=STATES.find(x=>x.id===id); const html=st?`<p style="color:var(--ink);font-weight:700">${st.label}</p>${st.note}`:'';
  document.getElementById('mNote').innerHTML=html; document.getElementById('mNoteSmall').innerHTML=html;
}
sel.addEventListener('change',()=>applyState(sel.value));
function step(d){ const i=STATES.findIndex(x=>x.id===sel.value); applyState(STATES[(i+d+STATES.length)%STATES.length].id); }
document.getElementById('mPrev').onclick=()=>step(-1);
document.getElementById('mNext').onclick=()=>step(1);
const mb=document.querySelector('.mockbar');
const setMh=()=>document.documentElement.style.setProperty('--mockh',mb.offsetHeight+'px');
new ResizeObserver(setMh).observe(mb); setMh();
applyState('setup');
</script>
</body>
</html>
